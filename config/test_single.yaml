# ═══════════════════════════════════════════════════════════════════════════════
# SAVUTESTI — yksi jo asennettu malli, nopea end-to-end-varmistus
# ═══════════════════════════════════════════════════════════════════════════════
# Tarkoitus: varmistaa että koko putki + uudet koodimuutokset (keep_alive, spinneri,
# log_video, konffit) toimivat ENNEN kuin isot mallit (qwen3-coder:30b, qwen3:14b)
# ovat latautuneet. Käyttää vain jo asennettua mallia:
#   huihui_ai/deepseek-r1-abliterated:32b  (19GB, mahtuu 32GB VRAM:iin)
#
# Kaikki paikalliset agentit samalla mallilla -> 0 mallinvaihtoa (sileä, nopea).
# Reviewer = api (Grok) luotettavan JSON-verdiktin vuoksi.
#   -> Täysin paikallinen: vaihda reviewer "huihui_ai/deepseek-r1-abliterated:32b".
#
# Aja:  $env:PYTHONUTF8=1; python main.py config/test_single.yaml
# Live: python scripts/live_view.py output/<run_id>
# ═══════════════════════════════════════════════════════════════════════════════

environment_progression:

  - name: "CartPole-v1"
    max_episode_steps: 500
    success_threshold: 475
    execution_timeout: 120        # 2 min katto — CartPole ratkeaa tässä helposti
    obs_dim: 4
    action_type: "discrete"
    action_dim: 2
    device: "cpu"

environment:
  name: "CartPole-v1"
  max_episode_steps: 500
  obs_dim: 4
  action_type: "discrete"
  action_dim: 2
  device: "cpu"

video:
  enabled: true
  output_dir: "output/videos"

agents:
  max_iterations: 6               # Savutesti: muutama iteraatio riittää
  show_thinking: false
  show_coder_output: false
  show_model_loading: true        # Näe että malli latautuu vain kerran (sama malli kaikille)
  show_env_switch_chatter: true

  history_window:
    manager: 2
    coder: 0
    tester: 5
    reviewer: 30
    env_switch_reports: 5
    agent_opinions: 10

  agent_opinions:
    enabled: true
    manager: true
    coder: false
    tester: false
    reviewer: true

llm:
  model: "grok-4.3"

# KAIKKI paikalliset agentit samalla jo-asennetulla mallilla -> ei swappeja
agent_llm:
  manager:   "huihui_ai/deepseek-r1-abliterated:32b"
  coder:     "huihui_ai/deepseek-r1-abliterated:32b"
  tester:    "huihui_ai/deepseek-r1-abliterated:32b"
  reviewer:  "api"               # vaihda "huihui_ai/deepseek-r1-abliterated:32b" jos haluat täysin paikallisen

adaptive_model_switching:
  enabled: false
  chaos_mode: false
  triggers:
    repeated_error_threshold: 2
    no_improvement_iterations: 3
    repetition_loop_threshold: 2
    timeout_threshold: 2
  model_pools:
    coder:
      models:
        - "huihui_ai/deepseek-r1-abliterated:32b"
    manager:
      models:
        - "huihui_ai/deepseek-r1-abliterated:32b"
    tester:
      models:
        - "huihui_ai/deepseek-r1-abliterated:32b"

ollama:
  base_url: "http://localhost:11434/v1"
  api_key: "ollama"
  keep_alive: "10m"
  options:
    num_gpu: 999
    num_thread: 8
  model_options:
    "huihui_ai/deepseek-r1-abliterated:32b": { num_ctx: 32768 }

gpu:
  enabled: true
  max_vram_gb: 4.0
  warn_vram_gb: 2.0

training_phases:
  enabled: true
  validation_timeout_multiplier: 0.02
  demo_timeout_seconds: 300

shodan_rules:
  enabled: true
  max_rules: 20

prompts_file: "config/opus_prompts.yaml"

failsafe:
  skip_after_consecutive_failures: 3

test_name: "test_single"

verbose:
  tester_wake_up: false
  gpu_validation: false
  docker_sandbox_info: false
  gpu_vram_stats: false
  video_file_check: false
  doc_analysis_result: false
  shodan_response_in_results: false
  shodan_rules: true
