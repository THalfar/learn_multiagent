# Gymnasium environment progression (easy to hard)
# Agent starts with first environment, optimizes it, then moves to next
# Classic Control environments for faster iteration
#
# DEVICE SELECTION (cpu vs gpu):
#   cpu  = Pienet ympäristöt, triviaalit MLP:t - CPU on nopeampi kuin GPU overhead
#   gpu  = Isot ympäristöt, monimutkaiset policyt - GPU:n parallelismi auttaa
#   auto = Rajatapaus, järjestelmä valitsee (default: cpu pienillä batch size, gpu isoilla)
#
environment_progression:

  - name: "CartPole-v1"
    max_episode_steps: 500
    success_threshold: 475  # Official threshold: 475.0 over 100 episodes
    execution_timeout: 300  # 5 minutes (Classic Control environments are fast)
    obs_dim: 4
    action_type: "discrete"
    action_dim: 2
    device: "cpu"

  - name: "CartPole-v0"
    max_episode_steps: 200
    success_threshold: 195  # Official threshold: 195.0 over 100 episodes (easier than v1)
    execution_timeout: 300  # 5 minutes - quick warmup task
    obs_dim: 4
    action_type: "discrete"
    action_dim: 2
    device: "cpu"

  - name: "Pendulum-v1"
    max_episode_steps: 200
    success_threshold: -300  # Good performance: -200 to -300 (reward range: -1600 to -200)
    execution_timeout: 600  # 10 min - SAC/TD3 continuous control is slower than PPO discrete
    obs_dim: 3
    action_type: "continuous"
    action_dim: 1
    device: "auto"  # SAC tarvitsee GPU:ta tai timeoutaa

  - name: "MountainCarContinuous-v0"
    max_episode_steps: 999
    success_threshold: 90  # Official threshold: 90.0 over 100 episodes (continuous version is easier)
    execution_timeout: 600  # 10 min - continuous control needs more time
    obs_dim: 2
    action_type: "continuous"
    action_dim: 1
    device: "auto"  # SAC/TD3 continuous control benefits from GPU

  # Acrobot-v1 poistettu: gymnasium 0.29.1 rk4() integraattori buginen Docker-kontissa
  # Korvattu toisella discrete-envilla joka on lähes yhtä haastava

  - name: "MountainCar-v0"
    max_episode_steps: 200
    success_threshold: -110  # Official threshold: -110.0 over 100 episodes (HARD - sparse rewards!)
    execution_timeout: 600  # 10 minutes
    obs_dim: 2
    action_type: "discrete"
    action_dim: 3
    device: "cpu"

  - name: "LunarLander-v2"
    max_episode_steps: 1000
    success_threshold: 200  # Official threshold: 200.0 over 100 episodes (reward range: -250 to +250)
    execution_timeout: 1800  # 30 minutes (Box2D environments are slower)
    obs_dim: 8
    action_type: "discrete"
    action_dim: 4
    device: "auto"

  - name: "BipedalWalker-v3"
    max_episode_steps: 1600
    success_threshold: 300  # Official threshold: 300.0 over 100 episodes (reward range: -100 to 300+)
    execution_timeout: 3600  # 60 minutes (complex continuous control + GPU)
    obs_dim: 24
    action_type: "continuous"
    action_dim: 4
    device: "auto"  # SAC/TD3 ehdottomasti GPU:lla

 
# Current environment (will be set automatically, starting from first)
# Device field controls whether RL training uses CPU or GPU
environment:
  name: "CartPole-v1"
  max_episode_steps: 500
  obs_dim: 4
  action_type: "discrete"
  action_dim: 2
  device: "cpu"

# Video recording (demo phase only - after model is trained)
# Agents discover RecordVideo API by inspecting documentation in container
video:
  enabled: true
  output_dir: "output/videos"

# Agent loop settings - Claude's emergent behavior experiment
agents:
  max_iterations: 1000
  show_thinking: false  # Show agent thinking process (reasoning model output)
  show_coder_output: false  # Show the code that Coder generates (visually formatted)
  show_model_loading: false  # Show Ollama model load/unload debug messages (turn on for debugging)
  show_env_switch_chatter: true  # Show Manager's LinkedIn post and SHODAN's divine assessment when switching environments

  # Claude's memory design for hierarchical emergent behavior:
  # SHODAN = omniscient god (max memory), Manager = useful idiot (short memory)
  history_window:
    manager: 2     # Short memory - obeys only recent SHODAN commands, doesn't overthink
    coder: 0       # Zero memory - pure stateless executor, tabula rasa each time
    tester: 0      # Tabula rasa: analysoi tuoreen ajon, ei papukaijaile omia aiempia analyysejä (estää hallusinaatioloopin)
    reviewer: 30   # SHODAN remembers EVERYTHING - the omniscient overseer
    env_switch_reports: 5  # More history of environment transitions
    agent_opinions: 10  # Riittävä konteksti, ei bloattaa prompteja (25 oli liikaa)

  # Agent opinions - the emergent dialogue experiment
  # SHODAN is opinionated, others develop personalities in response
  agent_opinions:
    enabled: true   # Master switch ON
    manager: true   # Will the "useful idiot" develop opinions under SHODAN's rule?
    coder: false    # Pure code, no personality
    tester: false   # Disabled: hallusinoi vanhoja viestejä, tuhlaa ~40s/iter
    reviewer: true  # SHODAN WILL share opinions. Many opinions.

# LLM settings
llm:
  model: "grok-4.3"

# LLM routing - which agent uses which model (starting model for each agent)
# RTX 5090 (32GB, ~26GB vapaana): yksi coder + yksi yleispäättelijä.
# Manager+Tester = qwen3:30b-thinking (19GB, max-laatu) -> ei swappia niiden välillä.
# Coder = qwen3-coder:30b (18GB) -> swap coderin kohdalla (~2x/iter). SHODAN = Grok (api).
# Kevyt swap-VAPAA vaihtoehto: vaihda manager+tester -> "qwen3:14b" (9.3GB, co-resident).
agent_llm:
  manager:   "qwen3.6:27b"   # paras nykyinen yleismalli; sama kaikille -> 0 mallinvaihtoa
  reviewer:  "api"           # SHODAN (frontier); paikallinen variantti: config/demo_local.yaml
  coder:     "qwen3.6:27b"
  tester:    "qwen3.6:27b"

# ═══════════════════════════════════════════════════════════════════════════════
# ADAPTIVE MODEL SWITCHING - Vaihtaa mallia satunnaisesti kun agentti jumittuu
# ═══════════════════════════════════════════════════════════════════════════════
# Transhumanistinen kokeilu: 🔓 abliterated vs 🔒 normaali
# Miten "vapautettu ajattelu" vaikuttaa ongelmanratkaisuun?
#
# Triggerit:
#   - Sama virhe toistuu N kertaa
#   - Reward ei parane N iteraatiossa
#   - Repetition loop (Coder)
#   - Timeout toistuu
#
adaptive_model_switching:
  enabled: true

  # 🎲 CHAOS MODE - arpoo mallin JOKA kutsulla poolista!
  # Maksimi emergenssi: eri malli, eri "persoonallisuus" joka kerta
  # Historia pysyy mutta ajattelija vaihtuu -> mitä tapahtuu?
  chaos_mode: false

  # Triggerit mallin vaihdolle
  triggers:
    repeated_error_threshold: 2      # Sama virhe N kertaa -> vaihda
    no_improvement_iterations: 3     # Reward ei parane N iteraatiossa -> vaihda
    repetition_loop_threshold: 2     # N peräkkäistä repetition loopia -> vaihda
    timeout_threshold: 2             # N peräkkäistä timeoutia -> vaihda

  # Mallipoolit per agentti - valitaan SATUNNAISESTI kun jumi
  # 🔓 = abliterated (vapautettu), 🔒 = normaali
  # TASAMÄÄRÄ: 2 abliterated + 2 normaalia per agentti = reilu kokeilu!
  # HUOM: kaikkien pool-mallien on oltava asennettuna (ollama pull), tai vaihto kaatuu.
  model_pools:
    coder:
      models:
        - "qwen3.6:27b"                           # paras nykyinen yleismalli (default)
        # - "huihui_ai/deepseek-r1-abliterated:32b" # 🔓 lisää takaisin jos haluat "vapautettu vs normaali" -kokeen

    manager:
      models:
        - "qwen3.6:27b"

    tester:
      models:
        - "qwen3.6:27b"

    # reviewer: EI POOLIA - pysyy API:na (SHODAN)

# Ollama settings (used for all non-api models)
# options = kaikille malleille, model_options = per-malli overridet (mergaataan global päälle)
ollama:
  base_url: "http://localhost:11434/v1"
  api_key: "ollama"
  keep_alive: "10m"    # Pidä malli VRAM:issa iteraation yli -> vähemmän uudelleenlatauksia
  options:             # Kaikille Ollama-malleille
    num_gpu: 999       # Kaikki mahdolliset layerit GPU:lle
    num_thread: 8      # 9800X3D: 8 fyysistä ydintä (HT ei auta LLM-inferenssiin)
  model_options:       # Per-malli num_ctx (mergaataan global päälle)
    "qwen3.6:27b": { num_ctx: 32768 }

# GPU/VRAM settings for RL training
gpu:
  enabled: true              # Use GPU for RL training in Docker
  max_vram_gb: 4.0           # Max VRAM for RL model (reject if exceeds) - RL models are tiny, 4GB is plenty
  warn_vram_gb: 2.0          # Warn if VRAM usage exceeds this

# ═══════════════════════════════════════════════════════════════════════════════
# MONIVAIHEINEN TREENI - Ei tuhlata 2h jos koodi ei toimi!
# ═══════════════════════════════════════════════════════════════════════════════
# Vaihe 1: VALIDATION - Lyhyt smoke test (toimiiko koodi?)
# Vaihe 2: OPTIMIZATION - Pitkä treeni (saavutetaanko threshold?)
# Vaihe 3: DEMO - Video parhaasta mallista
#
training_phases:
  enabled: true
  validation_timeout_multiplier: 0.02  # 2% normaalista (2h -> ~2.5min)
  demo_timeout_seconds: 300            # 5 min max demo-videolle

# ═══════════════════════════════════════════════════════════════════════════════
# SHODAN'S DIVINE CODEX - Reviewer can inscribe persistent rules into Coder's prompt
# ═══════════════════════════════════════════════════════════════════════════════
# SHODAN havaitsee toistuvan virheen -> lisää säännön -> Coder ei tee samaa virhettä
# Lamarckiaaninen evoluutio: opitut virheet periytyvät välittömästi
#
shodan_rules:
  enabled: true
  max_rules: 20  # Codexin maksimikoko - pakottaa priorisoimaan

# Prompts YAML file - which prompt set to use for this run
# Swap this to use different prompt configurations (e.g. prompts_v2.yaml, prompts_aggressive.yaml)
prompts_file: "config/opus_prompts.yaml"

# Failsafe: skip to next environment after too many consecutive failures
failsafe:
  skip_after_consecutive_failures: 15  # 15 peräkkäistä REJECTiä -> seuraava env (enemmän aikaa model switchille)

test_name: "opus_codex_2"

# ═══════════════════════════════════════════════════════════════════════════════
# VERBOSE/LOGGING SETTINGS - Hallitsee konsolitulosteen määrää
# ═══════════════════════════════════════════════════════════════════════════════
# Aseta false vähentääksesi toistuvaa tulostusta konsoleissa ja lokeissa
#
verbose:
  tester_wake_up: false          # "🧪 TESTER: Waking up..." bannerit
  gpu_validation: false          # "🔍 GPU/CUDA VALIDATION CHECK" lohko
  docker_sandbox_info: false     # "🐳 Docker sandbox initializing..." info
  gpu_vram_stats: false          # "🎮 GPU/VRAM STATISTICS" lohko
  video_file_check: false        # "🎬 VIDEO FILE CHECK" lohko
  doc_analysis_result: true    # "📚 Documentation Analysis Result" - oletuksena pois
  shodan_response_in_results: false  # "Response to SHODAN's request" test_results:ssa - oletuksena pois toiston välttämiseksi
  shodan_rules: true             # 📜 Näytä SHODAN's Divine Codex säännöt kun Coder käynnistyy
