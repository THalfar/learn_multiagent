# ═══════════════════════════════════════════════════════════════════════════════
# ROBOTTIKÄSI — TÄYSIN PAIKALLINEN (ei Grokia / ei APIa lainkaan)
# ═══════════════════════════════════════════════════════════════════════════════
# Koe: pärjääkö tiimi KOKONAAN paikallisilla malleilla, kun frontier-SHODAN (Grok)
# ei ole käytössä? Tuomari/SHODAN ajetaan paikallisella qwen3.6:27b:llä -> kaikki
# neljä roolia samalla mallilla -> 0 mallinvaihtoa, co-resident 32GB VRAMissa.
#
# HER on SEEDATTU tarkoituksella: tämä koe eristää YHDEN muuttujan — "pärjääkö
# paikallinen tuomari ajamaan silmukkaa" — eikä sekoita siihen mahdotonta "keksi
# HER itse" -osaa (blind-ajot osoittivat ettei paikallismalli keksi HER:ää).
#
# Envit karsittu PARIIN: PandaReach (tunnetusti ratkeaa) + PandaPush (aito koetin).
# PickAndPlace jätetty pois — edes frontier+HER ei ratkaissut sitä, joten se vain
# söisi tunteja ja sumentaisi "toimiiko tämä" -signaalin.
#
# Aja:  $env:PYTHONUTF8=1; python main.py config/robot_local_only.yaml
# Live: python scripts/live_view.py output/<run_id>
# ═══════════════════════════════════════════════════════════════════════════════

environment_progression:

  - name: "PandaReach-v3"
    max_episode_steps: 50
    success_threshold: 0.90        # SUCCESS RATE (0..1), ei reward!
    metric: "success_rate"
    execution_timeout: 600
    obs_dim: 6
    action_type: "continuous"
    action_dim: 3
    device: "auto"

  - name: "PandaPush-v3"
    max_episode_steps: 50
    success_threshold: 0.50        # SUCCESS RATE — ratkeaa HER:llä (jos ratkeaa)
    metric: "success_rate"
    execution_timeout: 1200
    obs_dim: 18
    action_type: "continuous"
    action_dim: 3
    device: "auto"

environment:
  name: "PandaReach-v3"
  max_episode_steps: 50
  obs_dim: 6
  action_type: "continuous"
  action_dim: 3
  device: "auto"

video:
  enabled: true
  output_dir: "output/videos"

agents:
  max_iterations: 60              # Reach ratkeaa ~5-8:ssa, loput Pushille
  show_thinking: false
  show_coder_output: false
  show_model_loading: true
  show_env_switch_chatter: true

  history_window:
    manager: 3
    coder: 2       # qwen3.6 sietää oman historiansa -> oppii omista hylätyistä yrityksistä
    tester: 0      # Tabula rasa: paikallinen Tester EI papukaijaile vanhoja analyysejaan (estää hallusinaatioloopin)
    reviewer: 20   # Paikallinen 32k-konteksti riittää tähän (pilvi-SHODANilla 30)
    env_switch_reports: 5
    agent_opinions: 10

  agent_opinions:
    enabled: true
    manager: true
    coder: false
    tester: false
    reviewer: true

llm:
  model: "grok-4.3"   # EI käytössä (reviewer ei ole "api"); kenttä vaaditaan silti

# ═══════════════════════════════════════════════════════════════════════════════
# MALLIT — KAIKKI PAIKALLISIA, REVIEWER MUKAAN LUKIEN
# ═══════════════════════════════════════════════════════════════════════════════
# reviewer = qwen3.6:27b (sama kuin muut kolme) -> 0 mallinvaihtoa, co-resident.
# Jos paikallisen tuomarin arviot näyttävät heikoilta, vaihda reviewer ->
# "qwen3:30b-thinking" (reasoning-malli, parempi tuomarointi mutta swap/iter ~10-20s,
# koska 18GB+17GB ei mahdu yhtä aikaa 32GB:hen).
agent_llm:
  manager:   "qwen3.6:27b"
  coder:     "qwen3.6:27b"
  tester:    "qwen3.6:27b"
  reviewer:  "qwen3.6:27b"   # PAIKALLINEN SHODAN — EI "api"

adaptive_model_switching:
  enabled: false
  chaos_mode: false
  triggers:
    repeated_error_threshold: 2
    no_improvement_iterations: 3
    repetition_loop_threshold: 2
    timeout_threshold: 2
  model_pools:
    coder:
      models:
        - "qwen3.6:27b"
    manager:
      models:
        - "qwen3.6:27b"
    tester:
      models:
        - "qwen3.6:27b"

ollama:
  base_url: "http://localhost:11434/v1"
  api_key: "ollama"
  keep_alive: "10m"
  options:
    num_gpu: 999
    num_thread: 8
  model_options:
    "qwen3.6:27b": { num_ctx: 32768 }

gpu:
  enabled: true
  max_vram_gb: 4.0
  warn_vram_gb: 2.0

training_phases:
  enabled: true
  validation_timeout_multiplier: 0.05
  validation_timeout_floor: 90    # panda-gym/pybullet + SAC-init syö ~20-40s kiinteää käynnistystä
  demo_timeout_seconds: 300

shodan_rules:
  enabled: true
  max_rules: 20

prompts_file: "config/opus_prompts.yaml"

failsafe:
  skip_after_consecutive_failures: 15   # Laskuri nollautuu kun metric paranee -> aidosti jumittunut env skipataan

# SEEDED: Codex esiseedattu HER-reseptillä (rakenteellinen oivallus annettu).
initial_codex_rules:
  - "Goal-conditioned sparse-reward envs (Dict observation with achieved_goal/desired_goal) REQUIRE Hindsight Experience Replay. Use SAC with policy='MultiInputPolicy', replay_buffer_class=HerReplayBuffer, replay_buffer_kwargs={'n_sampled_goal': 4, 'goal_selection_strategy': 'future'}. Plain SAC/PPO/TD3 without HER cannot solve PandaPush/PandaPickAndPlace."

# Oma skills_dir -> tämän paikallisajon oppiminen ei sekoitu seeded/blind-ajoihin (puhdas erottelu).
skills_dir: "skills/local_only"
initial_skills:
  - name: "Goal-conditioned envs need HER"
    when_to_use: "Dict observation with achieved_goal/desired_goal (panda/fetch robotic manipulation), sparse reward."
    procedure: "Use SAC with policy='MultiInputPolicy', replay_buffer_class=HerReplayBuffer, replay_buffer_kwargs={'n_sampled_goal':4,'goal_selection_strategy':'future'}. Read max_episode_steps from env.spec and set learning_starts >= that. Each optimization iteration resume from the checkpoint: SAC.load(path, env=env) + model.load_replay_buffer(buf), then print(f'RESUMED: buffer_transitions={model.replay_buffer.size()}'), learn one wall-clock-sized chunk, then save model + replay buffer. Report success_rate (the is_success fraction over >= 20 eval episodes with fixed seeds), not the raw sparse reward."
    pitfalls: "Plain SAC/PPO/TD3 without HER cannot solve PandaPush/PandaPickAndPlace. Never pass reset_num_timesteps=False (breaks termination on a reloaded model). 30k steps is starvation - size the chunk from measured steps/s and let chunks accumulate. Resuming the model WITHOUT load_replay_buffer silently forgets everything - the Tester rejects a resume without the RESUMED proof line."
    verification: "RESULT line prints success_rate in [0,1] >= the env success_threshold."
    tags: ["goal", "her", "manipulation", "robotics", "success_rate"]
    status: "verified"

test_name: "robot_local_only"

verbose:
  tester_wake_up: false
  gpu_validation: false
  docker_sandbox_info: false
  gpu_vram_stats: false
  video_file_check: false
  doc_analysis_result: false
  shodan_response_in_results: false
  shodan_rules: true
