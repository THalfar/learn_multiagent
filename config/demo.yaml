# ═══════════════════════════════════════════════════════════════════════════════
# DEMO CONFIG — Lyhyt, luotettava ajo työpaikan AI-iltoihin
# ═══════════════════════════════════════════════════════════════════════════════
# Aja:  $env:PYTHONUTF8=1; python main.py config/demo.yaml
# Live-näkymä (toinen terminaali):  python scripts/live_view.py output/<run_id>
#
# Erot project.yaml:iin:
#   - Vain 2 nopeaa ympäristöä (CartPole-v1 -> CartPole-v0), ei tunnin timeouteja
#   - max_iterations pieni, failsafe nopea -> ajo päättyy ajoissa vaikka jumittuisi
#   - adaptive_model_switching POIS -> ennustettava esitys (ei yllätysvaihtoja)
#   - Tuoreet paikalliset mallit RTX 5090:lle (yksi coder + yksi yleispäättelijä)
#   - show_model_loading: true -> mallinvaihto näkyy "ajatteluna", ei jumilta
# ═══════════════════════════════════════════════════════════════════════════════

# Vain helpot, nopeat ympäristöt demoon (CPU, ratkeavat minuuteissa)
environment_progression:

  - name: "CartPole-v1"
    max_episode_steps: 500
    success_threshold: 475
    execution_timeout: 300
    obs_dim: 4
    action_type: "discrete"
    action_dim: 2
    device: "cpu"

  - name: "CartPole-v0"
    max_episode_steps: 200
    success_threshold: 195
    execution_timeout: 300
    obs_dim: 4
    action_type: "discrete"
    action_dim: 2
    device: "cpu"

environment:
  name: "CartPole-v1"
  max_episode_steps: 500
  obs_dim: 4
  action_type: "discrete"
  action_dim: 2
  device: "cpu"

video:
  enabled: true
  output_dir: "output/videos"

agents:
  max_iterations: 12              # Demo: tarpeeksi ratkaisuun, ei loputtomiin
  show_thinking: false
  show_coder_output: false
  show_model_loading: true        # Näytä mallinvaihto -> ei näytä jumilta livessä
  show_env_switch_chatter: true   # Managerin LinkedIn-postaus + SHODANin arvio

  history_window:
    manager: 2
    coder: 0
    tester: 0                     # Tabula rasa: ei papukaijaile omia aiempia analyysejä (estää hallusinaatioloopin)
    reviewer: 30
    env_switch_reports: 5
    agent_opinions: 10

  agent_opinions:
    enabled: true
    manager: true
    coder: false
    tester: false
    reviewer: true

llm:
  model: "grok-4.3"

# ═══════════════════════════════════════════════════════════════════════════════
# MALLIT — yksi coder + yksi yleispäättelijä (RTX 5090, 32GB, ~26GB vapaana)
# ═══════════════════════════════════════════════════════════════════════════════
# Coder:          qwen3-coder:30b      (18GB, 256K ctx, MoE 3B-aktiivinen -> nopea)
# Yleispäättelijä: qwen3:30b-thinking  (19GB, thinking-moodi, max-laatu)
#
# HUOM: coder 18GB + reasoner 19GB = 37GB > ~26GB vapaana -> EIVÄT mahdu yhtä aikaa
#   -> putki swappaa ~2x/iter (~20-40s/swap, näkyy spinnerinä). Tämä on max-laatu-valinta.
# Kevyempi swap-VAPAA vaihtoehto: vaihda manager+tester -> "qwen3:14b" (9.3GB, co-resident).
agent_llm:
  manager:   "qwen3.6:27b"   # paras nykyinen yleismalli; sama kaikille -> 0 mallinvaihtoa
  coder:     "qwen3.6:27b"
  tester:    "qwen3.6:27b"
  reviewer:  "api"           # SHODAN (Grok). Paikallinen variantti: ks. demo_local.yaml

# Demossa POIS -> ennustettava esitys (ei yllätysmallinvaihtoja kesken ajon)
adaptive_model_switching:
  enabled: false
  chaos_mode: false
  triggers:
    repeated_error_threshold: 2
    no_improvement_iterations: 3
    repetition_loop_threshold: 2
    timeout_threshold: 2
  model_pools:
    coder:
      models:
        - "qwen3-coder:30b"
    manager:
      models:
        - "qwen3:30b-thinking"
    tester:
      models:
        - "qwen3:30b-thinking"

# ═══════════════════════════════════════════════════════════════════════════════
# OLLAMA — VRAM/konteksti-optimointi 5090:lle
# ═══════════════════════════════════════════════════════════════════════════════
ollama:
  base_url: "http://localhost:11434/v1"
  api_key: "ollama"
  keep_alive: "10m"               # Pidä mallit VRAM:issa iteraation yli (vähemmän uudelleenlatauksia)
  options:
    num_gpu: 999
    num_thread: 8
  model_options:
    "qwen3-coder:30b":    { num_ctx: 32768 }
    "qwen3:30b-thinking": { num_ctx: 32768 }
    # "qwen3:14b": { num_ctx: 16384 }   # kevyt swap-vapaa vaihtoehto reasonerille

gpu:
  enabled: true
  max_vram_gb: 4.0
  warn_vram_gb: 2.0

training_phases:
  enabled: true
  validation_timeout_multiplier: 0.02
  demo_timeout_seconds: 300

shodan_rules:
  enabled: true
  max_rules: 20

prompts_file: "config/opus_prompts.yaml"

failsafe:
  skip_after_consecutive_failures: 3   # Demo: luovu nopeasti jos jumissa -> seuraava env

test_name: "demo"

verbose:
  tester_wake_up: false
  gpu_validation: false
  docker_sandbox_info: false
  gpu_vram_stats: false
  video_file_check: false
  doc_analysis_result: false
  shodan_response_in_results: false
  shodan_rules: true
