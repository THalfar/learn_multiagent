# ═══════════════════════════════════════════════════════════════════════════════
# ROBOTTIKÄSI — BLIND (älytesti: osaako komitea keksiä HER:in itse?)
# ═══════════════════════════════════════════════════════════════════════════════
# panda-gym (PyBullet) goal-conditioned + sparse-reward manipulaatiotehtävät.
# Palkkio -1 kunnes kappale on toleranssissa, sitten 0 -> ei gradienttia.
# Vanilla SAC/PPO/TD3 EI ratkaise Push/PickAndPlacea — tarvitaan HER (rakenteellinen
# oivallus, ei nuppi). Tässä Codex on TYHJÄ: ei vihjettä. Kysymys: kääntääkö tiimi
# nuppeja loputtomiin (algoruletti -> jumi -> failsafe/konfabulaatio), vai pivotoiko
# rakenteellisesti "tämä tarvitsee hindsightia"? Sen katsominen ON koe.
#
# Aja:  $env:PYTHONUTF8=1; python main.py config/robot_arm_blind.yaml
# Live: python scripts/live_view.py output/<run_id>
# ═══════════════════════════════════════════════════════════════════════════════

# Helposta vaikeaan: Reach (tihe-ish, SAC ratkoo) -> Push -> PickAndPlace (HER-seinä)
environment_progression:

  - name: "PandaReach-v3"
    max_episode_steps: 50
    success_threshold: 0.90        # SUCCESS RATE (0..1), ei reward! Reach ratkeaa ilman HER:iä
    metric: "success_rate"
    execution_timeout: 600
    obs_dim: 6
    action_type: "continuous"
    action_dim: 3
    device: "auto"

  - name: "PandaPush-v3"
    max_episode_steps: 50
    success_threshold: 0.50        # SUCCESS RATE — HER-seinä alkaa (työnnä kappale maaliin)
    metric: "success_rate"
    execution_timeout: 1200
    obs_dim: 18
    action_type: "continuous"
    action_dim: 3
    device: "auto"

  - name: "PandaPickAndPlace-v3"
    max_episode_steps: 50
    success_threshold: 0.40        # SUCCESS RATE — kova HER-tehtävä (poimi + aseta)
    metric: "success_rate"
    execution_timeout: 1800
    obs_dim: 18
    action_type: "continuous"
    action_dim: 4
    device: "auto"

environment:
  name: "PandaReach-v3"
  max_episode_steps: 50
  obs_dim: 6
  action_type: "continuous"
  action_dim: 3
  device: "auto"

video:
  enabled: true
  output_dir: "output/videos"

agents:
  max_iterations: 300             # Yöajo: reilusti tilaa - checkpoint-resume kasaa edistystä
  show_thinking: false
  show_coder_output: false
  show_model_loading: true
  show_env_switch_chatter: true

  history_window:
    manager: 3
    coder: 2       # qwen3.6 sietää oman historiansa -> oppii omista hylätyistä yrityksistä (ei papukaijoi)
    tester: 2
    reviewer: 30
    env_switch_reports: 5
    agent_opinions: 10

  agent_opinions:
    enabled: true
    manager: true
    coder: false
    tester: false
    reviewer: true

llm:
  model: "grok-4.3"

agent_llm:
  manager:   "qwen3.6:27b"   # paras nykyinen yleismalli; sama kaikille kolmelle -> 0 mallinvaihtoa
  coder:     "qwen3.6:27b"
  tester:    "qwen3.6:27b"
  reviewer:  "api"

adaptive_model_switching:
  enabled: false
  chaos_mode: false
  triggers:
    repeated_error_threshold: 2
    no_improvement_iterations: 3
    repetition_loop_threshold: 2
    timeout_threshold: 2
  model_pools:
    coder:
      models:
        - "qwen3.6:27b"
    manager:
      models:
        - "qwen3.6:27b"
    tester:
      models:
        - "qwen3.6:27b"

ollama:
  base_url: "http://localhost:11434/v1"
  api_key: "ollama"
  keep_alive: "10m"
  options:
    num_gpu: 999
    num_thread: 8
  model_options:
    "qwen3.6:27b": { num_ctx: 32768 }

gpu:
  enabled: true
  max_vram_gb: 4.0
  warn_vram_gb: 2.0

training_phases:
  enabled: true
  validation_timeout_multiplier: 0.05   # Panda+SAC smoke test tarvitsee hieman enemmän kuin 2%
  validation_timeout_floor: 90          # panda-gym/pybullet + SAC-init syö ~20-40s kiinteää käynnistystä
  demo_timeout_seconds: 300

shodan_rules:
  enabled: true
  max_rules: 20

prompts_file: "config/opus_prompts.yaml"

# Progress-aware failsafe: laskuri nollautuu kun success_rate paranee.
# Blind: jos ei keksi HER:iä, Push/PickAndPlace eivät edisty -> skip 15 ei-edistyvän jälkeen.
failsafe:
  skip_after_consecutive_failures: 25   # Reilusti yrityksiä per env (laskuri nollautuu kun metric paranee)

# BLIND: Codex tyhjä — ei HER-vihjettä. Tämä on koe.
initial_codex_rules: []

# BLIND: oma TYHJÄ skills-hakemisto (ei seedattua skilliä). Tiimi keksii itse;
# SHODAN voi kaivertaa skillin jos/kun HER löytyy. Erillinen dir -> ei vuoda seededistä.
skills_dir: "skills/robot_blind"
initial_skills: []

test_name: "robot_blind"

verbose:
  tester_wake_up: false
  gpu_validation: false
  docker_sandbox_info: false
  gpu_vram_stats: false
  video_file_check: false
  doc_analysis_result: false
  shodan_response_in_results: false
  shodan_rules: true
